name: trend_radar
version: "1.0"
profile: trend_radar
config-version: 2

flags:
  send_anonymous_usage_stats: false

models:
  trend_radar:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +materialized: table

vars:
  # 'en': discover new phrases from English titles only (your call, Nov 4). 'all': every language.
  # Alias matching always runs on every language (names like Lucia or Vice City don't translate).
  topic_discovery_languages: en
