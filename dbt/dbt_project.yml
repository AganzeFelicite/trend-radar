name: trend_radar
version: "1.0"
profile: trend_radar
config-version: 2

flags:
  send_anonymous_usage_stats: false

models:
  trend_radar:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +materialized: table

vars:
  # 'en': discover new phrases from English titles only (your call, Nov 4). 'all': every language.
  # Alias matching always runs on every language (names like Lucia or Vice City don't translate).
  topic_discovery_languages: en
  # Scoring windows (docs/SCORING.md): momentum compares the last N hours with the N before; burst = last M hours.
  momentum_window_hours: 24
  burst_window_hours: 3
  # Semantic topic matching (docs/SCORING.md § AI topics): an item joins its nearest topic if the cosine similarity
  # is at least this, plus other topics within the tie margin of it (facets of one story).
  semantic_min_similarity: 0.72
  semantic_tie_margin: 0.03
