[project]
name = "trend-radar"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "anthropic>=2.4.0",
    "apscheduler>=3.10,<4",
    "dbt-core>=1.12.6",
    "dbt-postgres>=1.11.0",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "httpx>=0.27",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.0",
    "tenacity>=9.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
